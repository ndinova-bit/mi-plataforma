<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión Institucional - CFP N° 403</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- PDF-Lib CDN para manipulación de PDFs -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

  <!-- ENCABEZADO / NAVBAR -->
  <header class="bg-blue-900 text-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold">CFP N° 403 - Luján</h1>
        <p class="text-xs text-blue-200">Sistema de Gestión e Inscription / Emisión de Certificados</p>
      </div>
      <!-- Pestañas de navegación -->
      <nav class="mt-4 sm:mt-0 flex space-x-2">
        <button onclick="cambiarPestana('trayectos')" id="tab-btn-trayectos" class="px-4 py-2 rounded bg-blue-700 text-white font-semibold shadow">Trayectos</button>
        <button onclick="cambiarPestana('alumnos')" id="tab-btn-alumnos" class="px-4 py-2 rounded hover:bg-blue-800 text-blue-100 font-semibold">Seguimiento Alumnos</button>
      </nav>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container mx-auto px-4 py-8">

    <!-- SECCIÓN TRAYECTOS -->
    <section id="seccion-trayectos" class="block">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-gray-800">Oferta Cursos y Trayectos</h2>
        <button onclick="abrirModalTrayecto()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded shadow transition">
          + Agregar Trayecto
        </button>
      </div>

      <div id="contenedor-trayectos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Tarjetas dinámicas de trayectos -->
        <p class="text-gray-500 italic">Cargando trayectos...</p>
      </div>
    </section>

    <!-- SECCIÓN SEGUIMIENTO ALUMNOS -->
    <section id="seccion-alumnos" class="hidden">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
        <h2 class="text-xl font-bold text-gray-800">Seguimiento e Inscripciones de Alumnos</h2>
        <div class="w-full md:w-1/3">
          <input type="text" id="input-buscar-alumno" onkeyup="filtrarInscripciones()" placeholder="Buscar por Nombre o DNI..." class="w-full p-2 border border-gray-300 rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div class="bg-white rounded-lg shadow overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-200 text-gray-700 text-sm uppercase font-semibold border-b">
              <th class="p-4">Alumno / DNI</th>
              <th class="p-4">Trayecto / Curso</th>
              <th class="p-4">Estado</th>
              <th class="p-4">N° Egresado</th>
              <th class="p-4 text-center">Acciones / Certificado</th>
            </tr>
          </thead>
          <tbody id="tabla-inscripciones-body" class="divide-y divide-gray-200 text-sm">
            <!-- Filas dinámicas de inscripciones -->
            <tr>
              <td colspan="5" class="p-4 text-center text-gray-500 italic">Cargando inscripciones...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- MODAL PARA AGREGAR/EDITAR TRAYECTO -->
  <div id="modal-trayecto" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-lg p-6 relative max-h-[90vh] overflow-y-auto">
      <h3 id="modal-trayecto-titulo" class="text-lg font-bold text-gray-800 mb-4">Agregar Nuevo Trayecto</h3>
      <form id="form-trayecto" onsubmit="guardarTrayecto(event)">
        <input type="hidden" id="trayecto-id">
        <div class="mb-4">
          <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre del Trayecto / Curso</label>
          <input type="text" id="trayecto-nombre" required class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-semibold text-gray-700 mb-1">Certificación que Otorga</label>
          <input type="text" id="trayecto-certificacion" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ej: Certificado de Formación Profesional">
        </div>
        <div class="grid grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Horas Reloj</label>
            <input type="number" id="trayecto-horas" required class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Fecha Entrega/Emisión</label>
            <input type="text" id="trayecto-fecha" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ej: 23 de Septiembre de 2026">
          </div>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-semibold text-gray-700 mb-1">Resolución</label>
          <input type="text" id="trayecto-resolucion" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ej: RESOC-2021-3362-GDEBA-DGCYE">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-semibold text-gray-700 mb-1">Detalle / Descripción</label>
          <textarea id="trayecto-descripcion" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" rows="2" placeholder="CFP N° 403 - Distrito: Luján | Curso N° 395/26..."></textarea>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-semibold text-gray-700 mb-1">Módulos (formato JSON o lista)</label>
          <textarea id="trayecto-modulos" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none font-mono text-xs" rows="3" placeholder='[{"nombre": "Electricidad Básica", "codigo": "GH500"}]'></textarea>
        </div>
        <div class="flex justify-end space-x-2 pt-4 border-t">
          <button type="button" onclick="cerrarModalTrayecto()" class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 rounded font-semibold">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-semibold">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPT LÓGICA PRINCIPAL -->
  <script>
    // Configuración Supabase (Completar con tus claves si aplica)
    const SUPABASE_URL = 'https://tu-proyecto.supabase.co';
    const SUPABASE_KEY = 'tu-anon-key';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    let trayectosCache = [];
    let inscripcionesCache = [];

    // Cambiar de Pestañas
    function cambiarPestana(pestana) {
      const secTrayectos = document.getElementById('seccion-trayectos');
      const secAlumnos = document.getElementById('seccion-alumnos');
      const btnTrayectos = document.getElementById('tab-btn-trayectos');
      const btnAlumnos = document.getElementById('tab-btn-alumnos');

      if (pestana === 'trayectos') {
        secTrayectos.classList.remove('hidden');
        secAlumnos.classList.add('hidden');
        btnTrayectos.className = 'px-4 py-2 rounded bg-blue-700 text-white font-semibold shadow';
        btnAlumnos.className = 'px-4 py-2 rounded hover:bg-blue-800 text-blue-100 font-semibold';
      } else {
        secTrayectos.classList.add('hidden');
        secAlumnos.classList.remove('hidden');
        btnAlumnos.className = 'px-4 py-2 rounded bg-blue-700 text-white font-semibold shadow';
        btnTrayectos.className = 'px-4 py-2 rounded hover:bg-blue-800 text-blue-100 font-semibold';
        cargarInscripciones();
      }
    }

    // Modal Control
    function abrirModalTrayecto() {
      document.getElementById('form-trayecto').reset();
      document.getElementById('trayecto-id').value = '';
      document.getElementById('modal-trayecto-titulo').innerText = 'Agregar Nuevo Trayecto';
      document.getElementById('modal-trayecto').classList.remove('hidden');
    }

    function cerrarModalTrayecto() {
      document.getElementById('modal-trayecto').classList.add('hidden');
    }

    // Cargar Trayectos
    async function cargarTrayectos() {
      if (!supabaseClient) {
        // Datos de muestra si no hay DB conectada
        trayectosCache = [
          {
            id: 1,
            nombre: "ELECTRICISTA EN INMUEBLES",
            certificacion: "ELECTRICISTA EN INMUEBLES",
            horas: 500,
            fecha_entrega: "15 de Diciembre de 2026",
            resolucion: "RESOC-2021-3362-GDEBA-DGCYE",
            descripcion: "CFP N° 403 - Distrito: Luján | Curso N° 395/26",
            modulos: '[{"nombre": "Pedro poepepe", "codigo": "GH500"}]'
          }
        ];
        renderizarTrayectos(trayectosCache);
        return;
      }
      try {
        const { data, error } = await supabaseClient.from('trayectos').select('*');
        if (error) throw error;
        trayectosCache = data || [];
        renderizarTrayectos(trayectosCache);
      } catch (e) {
        console.error('Error al cargar trayectos:', e);
      }
    }

    function renderizarTrayectos(lista) {
      const contenedor = document.getElementById('contenedor-trayectos');
      contenedor.innerHTML = '';
      if (lista.length === 0) {
        contenedor.innerHTML = '<p class="text-gray-500 italic">No hay trayectos cargados.</p>';
        return;
      }
      lista.forEach(t => {
        const div = document.createElement('div');
        div.className = 'bg-white rounded-lg shadow p-5 border border-gray-200 flex flex-col justify-between';
        div.innerHTML = `
          <div>
            <span class="text-xs font-bold text-blue-600 bg-blue-100 px-2 py-1 rounded uppercase">${t.horas || 0} Hs Reloj</span>
            <h3 class="text-lg font-bold text-gray-800 mt-2">${t.nombre}</h3>
            <p class="text-xs text-gray-500 mt-1">${t.resolucion || ''}</p>
            <p class="text-sm text-gray-600 mt-3">${t.descripcion || ''}</p>
          </div>
          <div class="mt-4 pt-4 border-t flex justify-end space-x-2">
            <button onclick="editarTrayecto(${t.id})" class="text-sm px-3 py-1 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded font-semibold">Editar</button>
          </div>
        `;
        contenedor.appendChild(div);
      });
    }

    // Cargar Inscripciones / Alumnos
    async function cargarInscripciones() {
      const tbody = document.getElementById('tabla-inscripciones-body');
      if (!supabaseClient) {
        inscripcionesCache = [
          {
            id: 101,
            alumno_nombre: "PEREZ JUAN CARLOS",
            alumno_dni: "12345678",
            estado: "Completado",
            num_egresado: "100",
            trayecto: trayectosCache[0]
          }
        ];
        renderizarInscripciones(inscripcionesCache);
        return;
      }
      try {
        const { data, error } = await supabaseClient.from('inscripciones').select('*, trayectos(*)');
        if (error) throw error;
        inscripcionesCache = data || [];
        renderizarInscripciones(inscripcionesCache);
      } catch (e) {
        console.error('Error inscripciones:', e);
      }
    }

    function renderizarInscripciones(lista) {
      const tbody = document.getElementById('tabla-inscripciones-body');
      tbody.innerHTML = '';
      if (lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-500 italic">No se encontraron inscripciones.</td></tr>';
        return;
      }
      lista.forEach(i => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-gray-50';

        const trayectoObj = i.trayecto || i.trayectos || {};
        const trayectoJsonStr = encodeURIComponent(JSON.stringify(trayectoObj));
        const alumnoNombreEsc = encodeURIComponent(i.alumno_nombre || '');

        tr.innerHTML = `
          <td class="p-4 font-semibold text-gray-800">
            ${i.alumno_nombre}
            <div class="text-xs text-gray-500 font-normal">DNI: ${i.alumno_dni}</div>
          </td>
          <td class="p-4 text-gray-700">${trayectoObj.nombre || 'Curso'}</td>
          <td class="p-4">
            <span class="px-2 py-1 text-xs rounded font-bold bg-green-100 text-green-800">${i.estado || 'Aprobado'}</span>
          </td>
          <td class="p-4">
            <input type="text" id="num-eg-${i.id}" value="${i.num_egresado || '100'}" class="w-20 p-1 border rounded text-center">
          </td>
          <td class="p-4 text-center">
            <button onclick="generarCertificadoPDF_v2('${trayectoJsonStr}', '${alumnoNombreEsc}', '${i.alumno_dni}', '${i.id}')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-1 px-3 rounded text-xs shadow inline-flex items-center gap-1">
              📄 Emitir PDF
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filtrarInscripciones() {
      const q = document.getElementById('input-buscar-alumno').value.toLowerCase();
      const filtrados = inscripcionesCache.filter(i => 
        (i.alumno_nombre && i.alumno_nombre.toLowerCase().includes(q)) ||
        (i.alumno_dni && i.alumno_dni.includes(q))
      );
      renderizarInscripciones(filtrados);
    }

    /* ==========================================================================
       GENERADOR ESTAMPADOR VÍA PDF-LIB SOBRE plantilla.pdf (VERSIÓN V2 AJUSTADA)
       ========================================================================== */
    async function generarCertificadoPDF_v2(trayectoJson, alumnoNombre, usuarioDni, inscripcionId) {
      try {
        const trayecto = typeof trayectoJson === 'object' ? trayectoJson : JSON.parse(decodeURIComponent(trayectoJson));
        const alumno = decodeURIComponent(alumnoNombre);

        const inputNumEg = document.getElementById(`num-eg-${inscripcionId}`);
        let numEgresadoDef = inputNumEg ? inputNumEg.value.trim() : '';

        if (!numEgresadoDef) {
          numEgresadoDef = prompt('Ingrese N° de Egresado asignado:', '01');
          if (!numEgresadoDef) return;
        }

        const fEgreso = prompt('Ingrese Fecha de Egreso:', '27 de Noviembre de 2026');
        if (!fEgreso) return;

        let dniFormateado = String(usuarioDni).replace(/\D/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        let resVal = trayecto.resolucion || 'RESOC-2021-3362-GDEBA-DGCYE';
        let cfpVal = '403';
        let distritoVal = 'Luján';

        if (trayecto.descripcion) {
          const matchCfp = trayecto.descripcion.match(/CFP N° (.*?) -/);
          const matchDist = trayecto.descripcion.match(/Distrito: (.*?) \|/);
          if (matchCfp) cfpVal = matchCfp[1];
          if (matchDist) distritoVal = matchDist[1];
        }

        let hsReloj = trayecto.horas || '60';
        let fechaEmision = trayecto.fecha_entrega || '23 de Septiembre de 2026';

        // 1. Cargar la plantilla PDF desde la raíz
        const resBytes = await fetch('./plantilla.pdf');
        if (!resBytes.ok) throw new Error('No se encontró el archivo plantilla.pdf en la raíz.');
        const plantillaBytes = await resBytes.arrayBuffer();

        // 2. Cargar con pdf-lib
        const pdfDoc = await PDFLib.PDFDocument.load(plantillaBytes);
        const fuenteBold = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
        const fuenteNorm = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
        const colorNegro = PDFLib.rgb(0, 0, 0);

        const paginas = pdfDoc.getPages();
        const frente = paginas[0];
        const reverso = paginas.length > 1 ? paginas[1] : frente;

        // Dibujar línea punteada
        function dibujaRenglonPunteado(pagina, texto, xStart, yPos, xMax, font, size) {
          pagina.drawText(texto, { x: xStart, y: yPos, size: size, font: font, color: colorNegro });
          const textWidth = font.widthOfTextAtSize(texto, size);
          let puntoX = xStart + textWidth + 3;
          while (puntoX < xMax) {
            pagina.drawText('.', { x: puntoX, y: yPos, size: size, font: fuenteNorm, color: colorNegro });
            puntoX += 3;
          }
        }

        // Parsear fecha
        let diaE = '23', mesE = 'Septiembre', anioE = '26';
        if (fechaEmision) {
          const partesF = fechaEmision.split('de');
          if (partesF.length === 3) {
            diaE = partesF[0].trim();
            mesE = partesF[1].trim();
            anioE = partesF[2].trim().slice(-2);
          }
        }

        // ==========================================
        // 3. ESTAMPADO ANVERSO (PÁGINA 1)
        // Coordenadas corregidas en altura Y
        // ==========================================
        
        // 1. Nombre del Alumno: justo al lado de "Por cuanto" (Y=278)
        dibujaRenglonPunteado(frente, alumno.toUpperCase(), 150, 278, 520, fuenteBold, 11);

        // 2. D.U. N°: justo al lado de "D.U. N°" (Y=258)
        dibujaRenglonPunteado(frente, dniFormateado, 120, 258, 520, fuenteBold, 11);

        // 3. Trayecto / Curso de Formación Profesional (Y=210)
        dibujaRenglonPunteado(frente, trayecto.nombre.toUpperCase(), 60, 210, 520, fuenteBold, 10);

        // 4. CERTIFICADO DE... (Y=188)
        dibujaRenglonPunteado(frente, (trayecto.certificacion || trayecto.nombre).toUpperCase(), 330, 188, 520, fuenteBold, 10);

        // 5. Horas de duración (Y=166)
        frente.drawText(String(hsReloj), { x: 60, y: 166, size: 10, font: fuenteBold, color: colorNegro });

        // 6. Fecha de emisión (Y=166)
        frente.drawText(diaE, { x: 260, y: 166, size: 10, font: fuenteBold, color: colorNegro });
        frente.drawText(mesE, { x: 300, y: 166, size: 10, font: fuenteBold, color: colorNegro });
        frente.drawText(anioE, { x: 410, y: 166, size: 10, font: fuenteBold, color: colorNegro });

        // ==========================================
        // 4. ESTAMPADO REVERSO (PÁGINA 2)
        // ==========================================
        let modulosList = [];
        try {
          modulosList = typeof trayecto.modulos === 'string' ? JSON.parse(trayecto.modulos) : (trayecto.modulos || []);
        } catch (e) {}

        const yModulosArr = [320, 301, 282, 263, 244, 225, 206, 187, 168, 149];

        modulosList.slice(0, 10).forEach((m, idx) => {
          const modTxt = `${m.nombre} ${m.codigo ? '(' + m.codigo + ')' : ''}`;
          dibujaRenglonPunteado(reverso, modTxt, 55, yModulosArr[idx], 530, fuenteNorm, 9.5);
        });

        // Pie del Reverso
        reverso.drawText(fEgreso, { x: 130, y: 120, size: 10, font: fuenteBold, color: colorNegro });
        reverso.drawText(numEgresadoDef, { x: 130, y: 100, size: 10, font: fuenteBold, color: colorNegro });
        reverso.drawText(cfpVal, { x: 100, y: 25, size: 10, font: fuenteBold, color: colorNegro });
        reverso.drawText(distritoVal, { x: 200, y: 25, size: 10, font: fuenteBold, color: colorNegro });

        // 5. Generar PDF final y abrir
        const pdfBytesFinal = await pdfDoc.save();
        const blob = new Blob([pdfBytesFinal], { type: 'application/pdf' });
        const pdfUrl = URL.createObjectURL(blob);
        window.open(pdfUrl, '_blank');

      } catch (err) {
        alert('Error al generar el certificado sobre la plantilla: ' + err.message);
      }
    }

    // Inicializar al cargar la página
    window.onload = () => {
      cargarTrayectos();
    };
  </script>
</body>
</html>
