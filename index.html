<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma CFP 403</title>
  
  <!-- Fuente tipográfica moderna Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Hoja de Estilo Principal Unificada -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- 1. VISTA PÚBLICA / LANDING -->
  <div id="public-landing">
    <header style="background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <img src="PRUEBA CFP SIN FONDO.png" alt="CFP 403 Logo" style="height: 45px;">
        <h2 style="font-size: 1.25rem;">CFP N° 403 - San Martín</h2>
      </div>
      <button class="btn btn-primary" onclick="UI.showLoginScreen()">Ingresar / Registrarse</button>
    </header>

    <main style="max-width: 1000px; margin: 3rem auto; padding: 0 1rem;">
      <div class="card" style="text-align: center; padding: 3rem 1.5rem;">
        <h1>Oferta Académica y Trayectos Formativos</h1>
        <p style="color: var(--text-muted); margin-top: 0.5rem;">Consultá los cursos disponibles y sus respectivos módulos.</p>
      </div>

      <div id="lista-trayectos-cards" style="margin-top: 2rem;">
        <!-- Carga dinámica vía JS -->
      </div>
    </main>
  </div>

  <!-- 2. VISTA AUTH / LOGIN & REGISTRO -->
  <div id="login-screen" style="display: none; min-height: 100vh; align-items: center; justify-content: center; padding: 1rem;">
    <div class="card" style="width: 100%; max-width: 420px;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <img src="PRUEBA CFP SIN FONDO.png" alt="CFP Logo" style="height: 60px; margin-bottom: 0.5rem;">
        <h3 style="font-size: 1.25rem;">Acceso al Sistema</h3>
      </div>

      <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem;">
        <button id="tab-btn-login" class="btn btn-secondary active" style="flex: 1;" onclick="UI.toggleAuthTab('login')">Ingresar</button>
        <button id="tab-btn-register" class="btn btn-secondary" style="flex: 1;" onclick="UI.toggleAuthTab('register')">Solicitar Cuenta</button>
      </div>

      <!-- Formulario Login -->
      <form id="form-login" onsubmit="event.preventDefault(); Auth.iniciarSesion();">
        <div class="form-group">
          <label for="role-select">Rol de ingreso:</label>
          <select id="role-select" class="form-control">
            <option value="estudiante">Estudiante</option>
            <option value="docente">Docente</option>
            <option value="admin">Administrativo / Directivo</option>
          </select>
        </div>

        <div class="form-group">
          <label for="login-user">Usuario / DNI / Email:</label>
          <input type="text" id="login-user" class="form-control" required placeholder="Ej: 38123456">
        </div>

        <div class="form-group">
          <label for="login-pass">Contraseña:</label>
          <input type="password" id="login-pass" class="form-control" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Iniciar Sesión</button>
        <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 0.5rem;" onclick="UI.showLanding()">Volver a Inicio</button>
      </form>

      <!-- Formulario Registro -->
      <form id="form-register" style="display: none;" onsubmit="event.preventDefault(); Auth.solicitarRegistro();">
        <div class="form-group">
          <label for="reg-nombre">Nombre y Apellido:</label>
          <input type="text" id="reg-nombre" class="form-control" required placeholder="Juan Pérez">
        </div>

        <div class="form-group">
          <label for="reg-dni">DNI / Usuario:</label>
          <input type="text" id="reg-dni" class="form-control" required placeholder="Solo números">
        </div>

        <div class="form-group">
          <label for="reg-pass">Contraseña:</label>
          <input type="password" id="reg-pass" class="form-control" required placeholder="••••••••">
        </div>

        <div class="form-group">
          <label for="reg-rol">Tipo de Usuario:</label>
          <select id="reg-rol" class="form-control">
            <option value="estudiante">Estudiante</option>
            <option value="docente">Docente</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Enviar Solicitud</button>
        <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 0.5rem;" onclick="UI.showLanding()">Volver a Inicio</button>
      </form>
    </div>
  </div>

  <!-- 3. DASHBOARD / SISTEMA INTERNO -->
  <div id="app-screen" style="display: none;">
    <aside class="sidebar">
      <div style="padding-bottom: 1rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem;">
        <strong id="display-username">Usuario</strong>
        <p id="display-role" style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">ROL</p>
      </div>

      <nav style="display: flex; flex-direction: column; gap: 0.5rem; flex: 1;">
        <button id="btn-trayectos" class="btn btn-secondary" onclick="UI.showTab('trayectos')">Trayectos</button>
        <button id="btn-nuevo-trayecto" class="btn btn-secondary admin-only" onclick="UI.showTab('nuevo-trayecto')">Cargar Trayecto</button>
      </nav>

      <button class="btn btn-danger" style="margin-top: auto;" onclick="Auth.cerrarSesion()">Cerrar Sesión</button>
    </aside>

    <main class="main-content">
      <section id="trayectos" class="section active">
        <h2>Trayectos y Módulos</h2>
        <div id="dash-lista-trayectos" style="margin-top: 1rem;">
          <!-- Se completa mediante JS -->
        </div>
      </section>

      <section id="nuevo-trayecto" class="section admin-only">
        <h2>Nuevo Trayecto Formativo</h2>
        <form id="form-trayecto" onsubmit="event.preventDefault(); Trayectos.guardarTrayecto();" class="card" style="margin-top: 1rem;">
          <div class="form-group">
            <label for="trayecto-nombre">Nombre del Trayecto:</label>
            <input type="text" id="trayecto-nombre" class="form-control" required placeholder="Ej: Programación Web">
          </div>

          <div class="form-group">
            <label for="trayecto-sector">Sector Profesional:</label>
            <input type="text" id="trayecto-sector" class="form-control" placeholder="Ej: Informática / Comunicación">
          </div>

          <div class="form-group">
            <label for="trayecto-descripcion">Descripción:</label>
            <textarea id="trayecto-descripcion" class="form-control" rows="3"></textarea>
          </div>

          <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--border);">
          
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h4>Módulos del Trayecto</h4>
            <button type="button" class="btn btn-secondary" onclick="UI.agregarFilaModulo()">+ Agregar Módulo</button>
          </div>

          <div id="contenedor-modulos">
            <div class="modulo-card">
              <div class="modulo-row-header">
  <input type="text" class="mod-nombre form-control" placeholder="Nombre del Módulo">
  <input type="text" class="mod-codigo form-control" placeholder="Código (Ej: GH 0050)">
</div>
              <div class="modulo-row-dates">
                <label>Inicio:</label>
                <input type="date" class="mod-inicio form-control">
                <label>Fin:</label>
                <input type="date" class="mod-fin form-control">
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top: 1.5rem;">Guardar Trayecto Completo</button>
        </form>
      </section>
    </main>
  </div>

  <!-- Librerías Externas (CDNs) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Lógica Interna JS -->
  <script src="js/supabase-config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/trayectos.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof Trayectos !== 'undefined' && Trayectos.cargarTrayectos) {
        Trayectos.cargarTrayectos();
      }
    });
  </script>
</body>
</html>
